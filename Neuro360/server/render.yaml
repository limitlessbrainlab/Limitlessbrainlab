services:
  - type: web
    name: neuro360-backend
    env: node
    buildCommand: |
      apt-get update && apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Brevo HTTP API handles outbound mail on Render without blocked SMTP ports.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SMTP_PORT
        value: "2525"
      # Configure these on staging to relay mail through production.
      - key: MAIL_TRANSPORT
        sync: false
      - key: PRODUCTION_MAIL_BACKEND_URL
        sync: false
      - key: PRODUCTION_MAIL_RELAY_SECRET
        sync: false
      # Gmail credentials remain for inbound JotForm IMAP and local mail fallback.
      - key: EMAIL_USER
        value: info@limitlessbrainlab.com
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: info@limitlessbrainlab.com
